<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harry Potter-quiz</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      details { margin: 16px 0 24px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      summary { min-height: 48px; padding: 12px 0; cursor: pointer; font-weight: bold; }
      #settings-fields { padding: 8px 0 20px; }
      #settings-fields > p { display: grid; gap: 6px; margin: 12px 0; }
      #start, #practice { width: 100%; margin-top: 8px; }
      #start, #next { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold; box-shadow: inset 0 -2px 0 var(--gold); }
      #start:disabled { background: var(--surface); color: var(--muted); border-color: var(--line); }
      #start:disabled { box-shadow: none; }
      #start:not(:disabled):hover, #next:hover { background: #582033; color: #fff; }
      #round { scroll-margin-top: 16px; }
      #round-progress { margin: 0; color: var(--muted); font-size: 14px; }
      #answer-options legend { color: var(--muted); font-size: 14px; font-weight: normal; }
      #answer-options p { margin: 10px 0; }
      #answer-options button { width: 100%; min-height: 56px; text-align: left; }
      #answer-options button[data-selected="true"] { border: 2px solid var(--accent); padding: 11px 15px; color: var(--ink); }
      #feedback { scroll-margin-top: 16px; }
      #feedback p { margin: 16px 0; }
      #related { padding-left: 20px; }
      #related a { display: inline-block; padding: 10px 0; min-height: 44px; }
      #next { position: sticky; bottom: max(12px, env(safe-area-inset-bottom)); width: 100%; min-height: 52px; margin: 12px 0; box-shadow: inset 0 -2px 0 var(--gold), 0 0 0 8px #fff; }
      details { margin: 8px 0; }
      summary { min-height: 44px; padding: 10px 0; }
      #settings-panel > p { margin: 4px 0; color: var(--muted); font-size: 14px; }
      #settings-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 4px 0; }
      #settings-fields legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      #settings-fields > p { grid-template-columns: minmax(0, 1fr); align-content: end; gap: 4px; margin: 0; }
      #settings-fields > #available { display: block; grid-column: 1 / -1; margin: 0; font-size: 14px; }
      #start, #practice { margin-top: 4px; }
      body[data-playing="true"] header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      body[data-playing="true"] nav a:not(:first-child) { display: none; }
      body[data-playing="true"] h1 { font-size: 18px; }
      body[data-playing="true"] #quiz-status:not([data-warning]) { display: none; }
      #question-title { font-size: 22px; line-height: 1.25; margin: 8px 0; }
      #answer-options p { margin: 4px 0; }
      #answer-options button { min-height: 48px; padding: 10px 12px; }
      #answer-options button[data-selected="true"] { padding: 9px 11px; }
      #feedback p { margin: 8px 0; }
      #answer-details { border: 0; margin: 4px 0; }
      #answer-details summary { font-size: 14px; font-weight: normal; color: var(--accent); }
      #next { min-height: 48px; margin: 4px 0; bottom: max(4px, env(safe-area-inset-bottom)); }
      @media (max-height: 650px) {
        body[data-playing="true"] header { padding: 0; }
        body[data-playing="true"] main { padding-top: 4px; padding-bottom: max(4px, env(safe-area-inset-bottom)); }
        body[data-playing="true"] #settings-panel { margin: 4px 0; }
        #question-title { font-size: 20px; line-height: 1.2; margin: 6px 0; }
        #answer-options legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
        #next { padding: 10px 12px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Harry Potter-quiz</h1>
      <nav aria-label="Huvudnavigering">
        <a href="index.html">Hem</a>
        <a href="characters.html">Karaktärer</a>
        <a href="actors.html">Skådespelare</a>
        <a href="pets.html">Husdjur</a>
      </nav>
    </header>
    <main>
      <p id="quiz-status" role="status" aria-live="polite">Laddar frågor...</p>
      <details id="settings-panel" open>
        <summary>Ny omgång</summary>
        <p id="progress"></p>
        <p id="entity-filter" hidden></p>
        <form id="quiz-settings">
        <fieldset id="settings-fields" disabled>
          <legend>Inställningar</legend>
          <p><label for="canon">Källa</label>
            <select id="canon"><option value="all">Alla</option><option value="book">Böcker</option><option value="film">Filmer</option></select>
          </p>
          <p><label for="category">Ämne</label>
            <select id="category"><option value="all">Alla ämnen</option></select>
          </p>
          <p><label for="difficulty">Svårighetsgrad</label>
            <select id="difficulty"><option value="all">Alla nivåer</option><option value="easy">Lätt</option><option value="medium">Medel</option><option value="hard">Svår</option></select>
          </p>
          <p><label for="spoilers">Spoilers t.o.m. bok</label>
            <select id="spoilers"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7" selected>7</option></select>
          </p>
          <p><label for="count">Antal frågor</label>
            <select id="count"><option value="5">5</option><option value="10" selected>10</option><option value="20">20</option><option value="50">50</option></select>
          </p>
          <p id="available"></p>
          <button type="submit" id="start">Starta quiz</button>
          <button type="button" id="practice" aria-label="Öva på felaktiga svar">Öva fel svar</button>
        </fieldset>
        </form>
      </details>
      <section id="round" aria-labelledby="question-title" hidden>
        <p id="round-progress"></p>
        <h2 id="question-title" tabindex="-1"></h2>
        <fieldset id="answer-options"><legend>Välj ett svar</legend></fieldset>
        <div id="feedback" role="status" aria-live="polite"></div>
        <details id="answer-details" hidden>
          <summary>Förklaring och källa</summary>
          <div id="source"></div>
          <ul id="related"></ul>
        </details>
        <button id="next" type="button" hidden>Nästa fråga</button>
      </section>
      <section id="result" aria-labelledby="result-title" hidden>
        <h2 id="result-title" tabindex="-1">Resultat</h2>
        <p id="score"></p>
      </section>
    </main>
    <script type="module" src="quiz.mjs"></script>
  </body>
</html>
