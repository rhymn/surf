<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Skonsam fastsättning runt stammen, sedd uppifrån</title><rect width="800" height="340" rx="12" fill="#f4f1ea"/><circle cx="400" cy="180" r="90" fill="#a07f5f" stroke="#5a4333" stroke-width="8"/><circle cx="400" cy="180" r="22" fill="none" stroke="#8b6b4f" stroke-width="2"/><circle cx="400" cy="180" r="44" fill="none" stroke="#8b6b4f" stroke-width="2"/><circle cx="400" cy="180" r="66" fill="none" stroke="#8b6b4f" stroke-width="2"/><path d="M469.9,117.1 A94,94 0 0 1 469.9,242.9 L478.8,250.9 A106,106 0 0 0 478.8,109.1 Z" fill="#6b8f71" stroke="#3d5a43" stroke-width="1"/><path d="M294,166 A106,106 0 1 1 294,194" fill="none" stroke="#444441" stroke-width="7" stroke-linecap="butt"/><path d="M294,166 l-7,3 l14,5 l-14,5 l14,5 l-14,5 l7,3" fill="none" stroke="#854f0b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="506" y="150" width="22" height="60" rx="3" fill="#888780" stroke="#444441" stroke-width="1"/><rect x="528" y="128" width="104" height="104" rx="10" fill="#e4e8e0" stroke="#5f5e5a" stroke-width="1.5"/><text x="580" y="180" font-size="15" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Kuben</text><text x="400" y="34" font-size="14" font-weight="500" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">Bred, mjuk rem</text><line x1="400" y1="46" x2="400" y2="70" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/><text x="236" y="62" font-size="14" font-weight="500" fill="#2c2c2a" text-anchor="end" dominant-baseline="central">Elastisk spännare</text><text x="236" y="82" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="end" dominant-baseline="central">ger efter när trädet växer</text><line x1="244" y1="72" x2="286" y2="166" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/><text x="560" y="268" font-size="14" font-weight="500" fill="#2c2c2a" text-anchor="start" dominant-baseline="central">Mjukt stamskydd</text><text x="560" y="288" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="start" dominant-baseline="central">av filt eller gummi</text><line x1="552" y1="272" x2="487" y2="230" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/><text x="400" y="312" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle" dominant-baseline="central">Sett uppifrån. Inga spikar, skruvar eller borrhål.</text></svg>