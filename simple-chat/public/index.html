<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simple Chat</title>
        <script src="/socket.io/socket.io.js"></script>
        <script src="/icons.js"></script>
        <script src="/audio-call.js"></script>
        <script src="/dictation.js"></script>
        <script src="/client.js"></script>
        <meta name="description" content="URL based chat application for anyone on any device, no signup needed. Simply share the URL with those you wish to chat with.">
            <style>
            *{
                font-size: 16px;
            }

            body, html {
                height: 100%;
                margin: 0;
                font-family: Arial, sans-serif;
            }
            .chat-container {
                display: flex;
                flex-direction: column;
                height: calc(100vh - 50px); /* Adjust height to leave space for the menu */
            }
            .messages {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 10px;
            }
            .audio-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 8px;
                padding: 8px 10px;
                border-bottom: 1px solid #ddd;
                background: #f1f1f1;
            }
            #audio-status {
                flex: 1;
                min-width: 120px;
                overflow-wrap: anywhere;
            }
            #audio-controls {
                display: flex;
                gap: 8px;
            }
            .audio-bar button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                min-width: 44px;
                height: 44px;
                margin: 0;
            }
            .audio-bar svg { width: 20px; height: 20px; }
            .audio-bar [hidden] { display: none !important; }
            #leave-call { background: #b42332; }
            #mute-call, #call-notifications {
                border: 1px solid #267347;
                background: #267347;
                color: white;
            }
            #mute-call[aria-pressed="true"] {
                border-color: #a85b00;
                background: #fff0d6;
                color: #824600;
            }
            #call-notifications[aria-pressed="false"] {
                border-color: #888;
                background: white;
                color: #555;
            }
            .audio-bar button:disabled {
                border: 1px dashed #aaa;
                background: #e5e5e5;
                color: #777;
                cursor: not-allowed;
            }
            .audio-bar button:not(:disabled):hover { filter: brightness(0.9); }
            button:focus-visible { outline: 3px solid #111; outline-offset: 2px; }
            .message {
                padding: 10px;
                margin: 5px 0;
                border-radius: 10px;
                max-width: 60%;
                overflow-wrap: anywhere;
            }
            .delete-message, .edit-message {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                vertical-align: middle;
                width: 36px;
                height: 36px;
                padding: 6px;
                margin-left: 8px;
                background: transparent;
                color: inherit;
                border: 1px solid currentColor;
            }
            .delete-message svg, .edit-message svg { width: 18px; height: 18px; }
            .message-state {
                margin-left: 8px;
                font-size: 12px;
                font-style: italic;
            }
            .message.removed.user, .message.removed.other {
                background: #f1f1f1;
                color: #555;
                font-style: italic;
                border: 1px dashed #aaa;
            }
            .delete-message:disabled, .edit-message:disabled { opacity: 0.5; cursor: not-allowed; }
            .message.user {
                background-color: #007bff;
                color: white;
                margin-left: auto;
                text-align: right;
            }
            .message.other {
                background-color: #f1f1f1;
                color: black;
                margin-right: auto;
                text-align: left;
            }
            #chat-form {
                display: flex;
                flex-wrap: wrap;
                padding: 10px;
                background-color: #f1f1f1;
                position: fixed;
                bottom: 0;
                width: 100%;
                box-sizing: border-box;
            }
            #message-input {
                flex: 1;
                min-width: 0;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            #dictate-message {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex: 0 0 40px;
                height: 40px;
                padding: 8px;
            }
            #dictate-message svg { width: 20px; height: 20px; }
            #dictate-message[aria-pressed="true"] { background: #b42332; }
            #dictate-message:disabled { background: #ddd; color: #666; cursor: not-allowed; }
            #dictation-status {
                flex: 0 0 100%;
                margin-top: 6px;
                font-size: 14px;
                overflow-wrap: anywhere;
            }
            #chat-form [hidden] { display: none !important; }
            button {
                padding: 10px;
                border: none;
                background-color: #007bff;
                color: white;
                cursor: pointer;
                border-radius: 4px;
                margin-left: 10px;
            }
            button:hover {
                background-color: #0056b3;
            }
            .menu-container {
                display: none; /* Hide the original menu container */
            }
            dialog {
                border: none;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                padding: 20px;
                text-align: center;
            }
            .close-btn {
                position: absolute;
                top: 10px;
                right: 20px;
                font-size: 30px;
                cursor: pointer;
            }
            .language-setting {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 16px;
                text-align: left;
            }
            #dictation-language {
                padding: 8px;
                max-width: 100%;
                min-width: 0;
                border: 1px solid #888;
                border-radius: 4px;
                background: white;
                color: #111;
            }
        </style>
    </head>
    <body>
        <div class="chat-container">
            <div class="audio-bar" aria-label="Audio call">
                <span id="audio-status" role="status" aria-live="polite">Audio call</span>
                <button type="button" id="call-notifications" title="Enable call notifications" aria-label="Enable call notifications" aria-pressed="false" hidden><i data-lucide="bell" aria-hidden="true"></i></button>
                <button type="button" id="join-call" disabled><i data-lucide="phone" aria-hidden="true"></i>Join call</button>
                <div id="audio-controls" hidden>
                    <button type="button" id="play-call" title="Play call audio" aria-label="Play call audio" hidden><i data-lucide="volume-2" aria-hidden="true"></i></button>
                    <button type="button" id="mute-call" title="Mute microphone" aria-label="Mute microphone" aria-pressed="false"><i data-lucide="mic" aria-hidden="true"></i></button>
                    <button type="button" id="leave-call" title="Hang up" aria-label="Hang up"><i data-lucide="phone-off" aria-hidden="true"></i></button>
                </div>
            </div>
            <div id="remote-audio" hidden></div>
            <div class="messages" id="messages"></div>
            <form id="chat-form">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required />
                <button type="button" id="dictate-message" title="Dictate message" aria-label="Dictate message" aria-pressed="false" hidden><i data-lucide="speech" aria-hidden="true"></i></button>
                <button type="submit">Send</button>
                <button type="button" id="menu-button">
                    <span>&#9776;</span>
                </button>
                <span id="dictation-status" role="status" aria-live="polite" hidden></span>
            </form>
        </div>

        <dialog id="menu-modal">
            <span class="close-btn" id="close-btn">&times;</span>
            <h1>Simple Chat</h1>
            
            <p>Simple chat is a URL based chat application for anyone and any device, no signup needed. Simply share the URL with those you wish to chat with.</p>

            <a href="mailto:simple-chat.extinct538@passinbox.com">Contact</a>
            <a href="/random" id="create-room">New unique chat</a>
            <a href id="copy-url">Copy URL</a>
            <a href id="set-username">Set username</a>
            <a href id="invite-friends">Invite friends</a>
            <div class="language-setting">
                <label for="dictation-language">Dictation language</label>
                <select id="dictation-language">
                    <option value="">Browser default</option>
                    <option value="sv-SE">Swedish (Sweden)</option>
                    <option value="en-US">English (United States)</option>
                    <option value="en-GB">English (United Kingdom)</option>
                    <option value="da-DK">Danish</option>
                    <option value="nb-NO">Norwegian Bokmal</option>
                    <option value="fi-FI">Finnish</option>
                    <option value="de-DE">German</option>
                    <option value="fr-FR">French</option>
                    <option value="es-ES">Spanish</option>
                    <option value="it-IT">Italian</option>
                    <option value="nl-NL">Dutch</option>
                    <option value="pt-BR">Portuguese (Brazil)</option>
                    <option value="pl-PL">Polish</option>
                    <option value="ar-SA">Arabic (Saudi Arabia)</option>
                    <option value="hi-IN">Hindi</option>
                    <option value="ja-JP">Japanese</option>
                    <option value="zh-CN">Chinese (China)</option>
                </select>
            </div>
        </dialog>

        <script>
            const menuButton = document.getElementById('menu-button');
            const menuModal = document.getElementById('menu-modal');
            const closeButton = document.getElementById('close-btn');

            menuButton.addEventListener('click', () => {
                menuModal.showModal();
            });

            closeButton.addEventListener('click', () => {
                menuModal.close();
            });

            window.addEventListener('click', (event) => {
                if (event.target === menuModal) {
                    menuModal.close();
                }
            });


            // Adjust chat container height on iOS
            function adjustChatContainerHeight() {
                const chatContainer = document.querySelector('.chat-container');
                chatContainer.style.height = `${window.innerHeight - document.getElementById('chat-form').offsetHeight}px`;
            }

            window.addEventListener('resize', adjustChatContainerHeight);
            window.addEventListener('orientationchange', adjustChatContainerHeight);
            new ResizeObserver(adjustChatContainerHeight).observe(document.getElementById('chat-form'));
            adjustChatContainerHeight();
        </script>
    </body>
</html>
