<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simple Chat</title>
        <script src="/socket.io/socket.io.js"></script>
        <script src="/icons.js"></script>
        <script src="/profile.js"></script>
        <link rel="stylesheet" href="/profile.css">
        <script src="/audio-call.js"></script>
        <script src="/dictation.js"></script>
        <script src="/typing.js"></script>
        <script src="/client.js"></script>
        <script src="/read-state.js"></script>
        <meta name="description" content="URL based chat application for anyone on any device, no signup needed. Simply share the URL with those you wish to chat with.">
            <style>
            *{
                font-size: 16px;
            }

            body, html {
                height: 100%;
                margin: 0;
                font-family: Arial, sans-serif;
            }
            #send-message { display: inline-flex; align-items: center; justify-content: center; width: 44px; min-height: 44px; flex-shrink: 0; }
            #send-message svg { width: 20px; height: 20px; }
            #menu-button { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 10px; flex-shrink: 0; }
            #menu-button svg { width: 20px; height: 20px; }
            .chat-container {
                display: flex;
                flex-direction: column;
                height: calc(100vh - 50px); /* Adjust height to leave space for the menu */
            }
            .messages {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 10px;
                padding-bottom: 110px;
            }
            .room-header {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 10px;
                border-bottom: 1px solid #ddd;
            }
            .room-title-heading {
                flex: 1;
                min-width: 0;
                margin: 0;
                font-size: 18px;
                overflow-wrap: anywhere;
            }
            .back-to-chats {
                box-sizing: border-box;
                min-width: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex: 0 0 44px;
                height: 44px;
                margin: 0;
                padding: 8px;
                background: transparent;
                color: #555;
                border: 1px solid #aaa;
                border-radius: 4px;
            }
            #edit-room-title {
                display: block;
                width: 100%;
                min-height: 44px;
                margin: 0;
                padding: 8px;
                border: none;
                background: transparent;
                color: inherit;
                font: inherit;
                text-align: left;
                overflow-wrap: anywhere;
            }
            #room-title { font: inherit; }
            #edit-room-title:hover:not(:disabled) { background: #f1f4f2; color: #253e30; }
            .back-to-chats svg { width: 20px; height: 20px; }
            .back-to-chats { text-decoration: none; }
            #edit-room-title:disabled { opacity: 0.5; cursor: not-allowed; }
            #room-profile {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex: 0 1 auto;
                gap: 8px;
                min-width: 44px;
                max-width: 132px;
                height: 44px;
                margin: 0;
                padding: 8px 10px;
                border: 1px solid #bdc9c1;
                border-radius: 4px;
                background: white;
                color: #253e30;
                font: inherit;
            }
            #room-profile svg { width: 20px; height: 20px; flex-shrink: 0; }
            #room-username { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .audio-bar {
                display: flex;
                align-items: center;
                flex: 0 0 auto;
                gap: 4px;
            }
            #audio-status {
                flex: 0 1 auto;
                min-width: 0;
                max-width: 120px;
                overflow-wrap: anywhere;
            }
            #audio-controls {
                display: flex;
                gap: 8px;
            }
            .audio-bar button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                min-width: 44px;
                height: 44px;
                margin: 0;
            }
            .audio-bar svg { width: 20px; height: 20px; }
            .audio-bar [hidden] { display: none !important; }
            #leave-call { background: #b42332; }
            #mute-call, #call-notifications {
                border: 1px solid #267347;
                background: #267347;
                color: white;
            }
            #mute-call[aria-pressed="true"] {
                border-color: #a85b00;
                background: #fff0d6;
                color: #824600;
            }
            #call-notifications[aria-pressed="false"] {
                border-color: #888;
                background: white;
                color: #555;
            }
            .audio-bar button:disabled {
                border: 1px dashed #aaa;
                background: #e5e5e5;
                color: #777;
                cursor: not-allowed;
            }
            .audio-bar button:not(:disabled):hover { filter: brightness(0.9); }
            button:focus-visible { outline: 3px solid #111; outline-offset: 2px; }
            .message {
                padding: 10px;
                margin: 5px 0;
                border-radius: 10px;
                max-width: 60%;
                overflow-wrap: anywhere;
            }
            .delete-message, .edit-message {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                vertical-align: middle;
                width: 36px;
                height: 36px;
                padding: 6px;
                margin-left: 8px;
                background: transparent;
                color: inherit;
                border: 1px solid currentColor;
            }
            .delete-message svg, .edit-message svg { width: 18px; height: 18px; }
            .message-state {
                margin-left: 8px;
                font-size: 12px;
                font-style: italic;
            }
            .message.removed.user, .message.removed.other {
                background: #f1f1f1;
                color: #555;
                font-style: italic;
                border: 1px dashed #aaa;
            }
            .delete-message:disabled, .edit-message:disabled { opacity: 0.5; cursor: not-allowed; }
            .message.user {
                background-color: #007bff;
                color: white;
                margin-left: auto;
                text-align: right;
            }
            .message.other {
                background-color: #f1f1f1;
                color: black;
                margin-right: auto;
                text-align: left;
            }
            .message.other.unread { border-left: 3px solid #267347; }
            #chat-form {
                display: flex;
                flex-wrap: wrap;
                padding: 10px;
                background-color: #f1f1f1;
                position: fixed;
                bottom: 0;
                width: 100%;
                box-sizing: border-box;
            }
            .message-entry {
                position: relative;
                flex: 1;
                min-width: 0;
            }
            #message-input {
                width: 100%;
                min-width: 0;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            .message-entry:has(#dictate-message:not([hidden])) #message-input { padding-right: 48px; }
            .message-entry > input, #chat-form > button {
                box-sizing: border-box;
                height: 44px;
                min-height: 44px;
            }
            #dictate-message {
                position: absolute;
                top: 1px;
                right: 1px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 42px;
                height: 42px;
                margin: 0;
                padding: 8px;
                border-radius: 3px;
                background: transparent;
                color: #0056b3;
            }
            #dictate-message:hover:not(:disabled) { background: #eef4fa; }
            #dictate-message svg { width: 20px; height: 20px; }
            #dictate-message[aria-pressed="true"], #dictate-message[aria-pressed="true"]:hover { background: #b42332; color: white; }
            #dictate-message:disabled { color: #888; cursor: not-allowed; }
            .composer-statuses {
                position: absolute;
                bottom: calc(100% + 8px);
                left: 10px;
                right: 10px;
                display: flex;
                flex-direction: column;
                gap: 4px;
                pointer-events: none;
            }
            #dictation-status, #typing-status {
                padding: 8px 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                background: #f1f1f1;
                color: #333;
                font-size: 14px;
                line-height: 20px;
                overflow-wrap: anywhere;
                pointer-events: none;
            }
            #chat-form [hidden] { display: none !important; }
            button {
                padding: 10px;
                border: none;
                background-color: #007bff;
                color: white;
                cursor: pointer;
                border-radius: 4px;
                margin-left: 10px;
            }
            button:hover {
                background-color: #0056b3;
            }
            .menu-container {
                display: none; /* Hide the original menu container */
            }
            #menu-modal {
                box-sizing: border-box;
                width: min(440px, calc(100% - 32px));
                max-height: calc(100dvh - 32px);
                overflow-y: auto;
                border: none;
                border-radius: 8px;
                box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
                padding: 24px;
                text-align: left;
                color: #202624;
                background: white;
            }
            #menu-modal::backdrop { background: rgba(20, 30, 25, 0.35); }
            .settings-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
            .settings-header h2 { margin: 0; font-size: 22px; }
            .settings-header p { margin: 4px 0 0; font-size: 14px; color: #69766d; }
            #menu-modal svg { width: 20px; height: 20px; flex-shrink: 0; }
            #close-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex: 0 0 40px;
                height: 40px;
                padding: 8px;
                margin: 0;
                background: #f1f4f2;
                color: #59645e;
            }
            .settings-section { margin-top: 24px; }
            .settings-section h3 { font-size: 13px; margin: 0 0 10px; color: #69766d; font-weight: normal; }
            .settings-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .settings-action {
                box-sizing: border-box;
                display: flex;
                align-items: center;
                gap: 10px;
                min-height: 52px;
                padding: 12px;
                margin: 0;
                border: 1px solid #d9dfdb;
                border-radius: 4px;
                background: #fafbfa;
                color: #253e30;
                text-align: left;
                text-decoration: none;
                font: inherit;
                overflow-wrap: anywhere;
            }
            .settings-action:hover { background: #eef4ef; }
            .settings-action.primary { background: #267347; border-color: #267347; color: white; }
            .settings-action.primary:hover { background: #205d39; }
            .typing-setting { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 16px; cursor: pointer; }
            #show-typing { flex: 0 0 20px; width: 20px; height: 20px; margin: 0; accent-color: #267347; cursor: pointer; }
            .typing-setting span { min-width: 0; overflow-wrap: anywhere; }
            .language-setting { margin-top: 18px; }
            .language-setting label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; }
            .settings-footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid #d9dfdb; }
            .settings-footer a { display: inline-flex; align-items: center; gap: 8px; color: #59645e; font-size: 14px; text-decoration: none; }
            .settings-footer a:hover { text-decoration: underline; }
            @media (max-width: 360px) {
                #menu-modal { padding: 16px; }
                .settings-action { gap: 6px; padding: 10px; font-size: 14px; }
            }
            #dictation-language {
                box-sizing: border-box;
                width: 100%;
                min-height: 44px;
                padding: 8px;
                max-width: 100%;
                min-width: 0;
                border: 1px solid #888;
                border-radius: 4px;
                background: white;
                color: #111;
            }
        </style>
    </head>
    <body>
        <div class="chat-container">
            <header class="room-header">
                <a class="back-to-chats" href="/" title="My chats" aria-label="My chats"><i data-lucide="arrow-left" aria-hidden="true"></i></a>
                <h1 class="room-title-heading"><button type="button" id="edit-room-title" title="Edit group title" disabled><span id="room-title">Group chat</span></button></h1>
                <div class="audio-bar" aria-label="Audio call">
                    <span id="audio-status" role="status" aria-live="polite"></span>
                    <button type="button" id="call-notifications" title="Enable call notifications" aria-label="Enable call notifications" aria-pressed="false" hidden><i data-lucide="bell-off" aria-hidden="true"></i></button>
                    <button type="button" id="join-call" title="Join call" aria-label="Join call" disabled><i data-lucide="phone" aria-hidden="true"></i></button>
                    <div id="audio-controls" hidden>
                        <button type="button" id="play-call" title="Play call audio" aria-label="Play call audio" hidden><i data-lucide="volume-2" aria-hidden="true"></i></button>
                        <button type="button" id="mute-call" title="Mute microphone" aria-label="Mute microphone" aria-pressed="false"><i data-lucide="mic" aria-hidden="true"></i></button>
                        <button type="button" id="leave-call" title="Hang up" aria-label="Hang up"><i data-lucide="phone-off" aria-hidden="true"></i></button>
                    </div>
                </div>
                <button type="button" id="room-profile" title="Your profile" aria-label="Your profile"><i data-lucide="user-round" aria-hidden="true"></i><span id="room-username">Your profile</span></button>
            </header>
            <div id="remote-audio" hidden></div>
            <div class="messages" id="messages"></div>
            <form id="chat-form">
                <div class="message-entry">
                    <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required autofocus />
                    <button type="button" id="dictate-message" title="Dictate message" aria-label="Dictate message" aria-pressed="false" hidden><i data-lucide="speech" aria-hidden="true"></i></button>
                </div>
                <button type="submit" id="send-message" title="Send message" aria-label="Send message"><i data-lucide="send" aria-hidden="true"></i></button>
                <button type="button" id="menu-button" title="Settings" aria-label="Settings">
                    <i data-lucide="menu" aria-hidden="true"></i>
                </button>
                <div class="composer-statuses">
                    <span id="dictation-status" role="status" aria-live="polite" hidden></span>
                    <span id="typing-status" role="status" aria-live="polite" hidden></span>
                </div>
            </form>
        </div>

        <dialog id="menu-modal" aria-labelledby="settings-title">
            <div class="settings-header">
                <div><h2 id="settings-title">Settings</h2><p>Simple Chat</p></div>
                <button type="button" id="close-btn" title="Close settings" aria-label="Close settings"><i data-lucide="x" aria-hidden="true"></i></button>
            </div>
            <section class="settings-section" aria-label="Chats">
                <h3>Chats</h3>
                <div class="settings-actions">
                    <a class="settings-action primary" href="/"><i data-lucide="messages-square" aria-hidden="true"></i>My chats</a>
                    <a class="settings-action" href="/random" id="create-room"><i data-lucide="plus" aria-hidden="true"></i>New chat</a>
                    <button class="settings-action" type="button" id="copy-url"><i data-lucide="link" aria-hidden="true"></i>Copy link</button>
                    <button class="settings-action" type="button" id="invite-friends"><i data-lucide="user-plus" aria-hidden="true"></i>Invite friends</button>
                </div>
            </section>
            <section class="settings-section" aria-label="Preferences">
                <h3>Preferences</h3>
                <label class="typing-setting" for="show-typing">
                    <input type="checkbox" id="show-typing" checked>
                    <span>Show when I'm typing</span>
                </label>
            <div class="language-setting">
                <label for="dictation-language"><i data-lucide="languages" aria-hidden="true"></i>Dictation language</label>
                <select id="dictation-language">
                    <option value="">Browser default</option>
                    <option value="sv-SE">Swedish (Sweden)</option>
                    <option value="en-US">English (United States)</option>
                    <option value="en-GB">English (United Kingdom)</option>
                    <option value="da-DK">Danish</option>
                    <option value="nb-NO">Norwegian Bokmal</option>
                    <option value="fi-FI">Finnish</option>
                    <option value="de-DE">German</option>
                    <option value="fr-FR">French</option>
                    <option value="es-ES">Spanish</option>
                    <option value="it-IT">Italian</option>
                    <option value="nl-NL">Dutch</option>
                    <option value="pt-BR">Portuguese (Brazil)</option>
                    <option value="pl-PL">Polish</option>
                    <option value="ar-SA">Arabic (Saudi Arabia)</option>
                    <option value="hi-IN">Hindi</option>
                    <option value="ja-JP">Japanese</option>
                    <option value="zh-CN">Chinese (China)</option>
                </select>
            </div>
            </section>
            <footer class="settings-footer">
                <a href="mailto:simple-chat.extinct538@passinbox.com"><i data-lucide="mail" aria-hidden="true"></i>Contact</a>
            </footer>
        </dialog>

        <script>
            const menuButton = document.getElementById('menu-button');
            const menuModal = document.getElementById('menu-modal');
            const closeButton = document.getElementById('close-btn');

            menuButton.addEventListener('click', () => {
                menuModal.showModal();
            });

            closeButton.addEventListener('click', () => {
                menuModal.close();
            });

            window.addEventListener('click', (event) => {
                if (event.target === menuModal) {
                    const bounds = menuModal.getBoundingClientRect();
                    if (event.clientX < bounds.left || event.clientX > bounds.right ||
                        event.clientY < bounds.top || event.clientY > bounds.bottom) menuModal.close();
                }
            });


            // Adjust chat container height on iOS
            function adjustChatContainerHeight() {
                const chatContainer = document.querySelector('.chat-container');
                chatContainer.style.height = `${window.innerHeight - document.getElementById('chat-form').offsetHeight}px`;
            }

            window.addEventListener('resize', adjustChatContainerHeight);
            window.addEventListener('orientationchange', adjustChatContainerHeight);
            new ResizeObserver(adjustChatContainerHeight).observe(document.getElementById('chat-form'));
            adjustChatContainerHeight();
        </script>
    </body>
</html>
